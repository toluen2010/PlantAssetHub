<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Plant Asset Hub</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@3.4.1/dist/tailwind.min.css" rel="stylesheet">
</head>
<body class="bg-gray-100 font-sans min-h-screen">

    <!-- ========================================== -->
    <!-- LOGIN SCREEN                              -->
    <!-- ========================================== -->
    <div id="loginScreen" class="flex items-center justify-center min-h-screen bg-blue-50 px-4">
        <div class="bg-white rounded-2xl shadow-2xl p-8 max-w-md w-full">
            <div class="text-center">
                <h1 class="text-4xl font-bold text-blue-700 mb-2">⚙️ Plant Asset Hub</h1>
                <p class="text-gray-500 text-sm mb-8">Sign in with your work email</p>
            </div>

            <form id="loginForm" class="space-y-4">
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-1">Email Address</label>
                    <input
                        type="email"
                        id="loginEmail"
                        required
                        placeholder="name@company.com"
                        class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none"
                    />
                </div>
                <button
                    type="submit"
                    id="loginBtn"
                    class="w-full bg-blue-600 text-white font-bold py-3 rounded-lg hover:bg-blue-700 transition shadow-md"
                >
                    🚀 Sign In
                </button>
            </form>

            <div id="loginMessage" class="mt-4 text-center text-sm hidden"></div>

            <div class="mt-6 text-xs text-center text-gray-400 border-t pt-4">
                <p>⚠️ Demo: Any valid email works. New users are auto-added.</p>
            </div>
        </div>
    </div>

    <!-- ========================================== -->
    <!-- MAIN APP                                  -->
    <!-- ========================================== -->
    <div id="mainApp" class="hidden min-h-screen pb-20">

        <!-- Header -->
        <header class="bg-blue-700 text-white p-4 shadow-md sticky top-0 z-50 flex justify-between items-center">
            <div class="flex items-center gap-2">
                <h1 class="text-lg font-bold">⚙️ Plant Asset Hub</h1>
                <span id="userBadge" class="text-xs bg-blue-500 px-2 py-0.5 rounded-full"></span>
            </div>
            <div class="flex gap-2">
                <button id="refreshBtn" class="hidden text-sm bg-blue-800 px-3 py-1 rounded hover:bg-blue-900">🔄 Refresh</button>
                <button id="logoutBtn" class="text-sm bg-red-600 px-3 py-1 rounded hover:bg-red-700">🚪</button>
            </div>
        </header>

        <main class="max-w-md mx-auto p-4">

            <!-- Status Toast -->
            <div id="statusToast" class="hidden mb-4 p-3 rounded text-center font-semibold text-sm"></div>

            <!-- TAB 1: FORM VIEW -->
            <section id="formTab" class="space-y-4">
                <form id="inventoryForm" class="bg-white p-5 rounded-xl shadow space-y-4">
                    <h2 class="text-md font-bold text-gray-800 border-b pb-2">Log New Machinery</h2>

                    <div>
                        <label class="block text-sm font-semibold text-gray-700">Machine Name</label>
                        <input type="text" id="machineName" required class="w-full mt-1 p-2 border border-gray-300 rounded focus:ring-2 focus:ring-blue-500 outline-none">
                    </div>

                    <div>
                        <label class="block text-sm font-semibold text-gray-700">Identification Number (ID)</label>
                        <input type="text" id="machineId" required class="w-full mt-1 p-2 border border-gray-300 rounded focus:ring-2 focus:ring-blue-500 outline-none">
                    </div>

                    <div>
                        <label class="block text-sm font-semibold text-gray-700">Section</label>
                        <select id="section" class="w-full mt-1 p-2 border border-gray-300 rounded bg-white">
                            <option value="Liquid">💧 Liquid</option>
                            <option value="Solid">💊 Solid</option>
                            <option value="Antibiotic">🧪 Antibiotic</option>
                            <option value="External">📦 External</option>
                        </select>
                    </div>

                    <div>
                        <label class="block text-sm font-semibold text-gray-700">Type of Machine</label>
                        <select id="machineType" class="w-full mt-1 p-2 border border-gray-300 rounded bg-white text-sm"></select>
                    </div>

                    <div class="grid grid-cols-2 gap-2">
                        <div>
                            <label class="block text-sm font-semibold text-gray-700">Speed Run Rate</label>
                            <input type="number" id="speed" required class="w-full mt-1 p-2 border border-gray-300 rounded">
                        </div>
                        <div>
                            <label class="block text-sm font-semibold text-gray-700">Unit</label>
                            <select id="unit" class="w-full mt-1 p-2 border border-gray-300 rounded bg-white text-xs">
                                <option value="bottles per minute">Bottles / min</option>
                                <option value="tablet per minute">Tablets / min</option>
                                <option value="Carton per minute">Cartons / min</option>
                                <option value="Tubes per minute">Tubes / min</option>
                                <option value="sachet per minute">Sachets / min</option>
                                <option value="Label per minute">Labels / min</option>
                            </select>
                        </div>
                    </div>

                    <div class="grid grid-cols-2 gap-2">
                        <div>
                            <label class="block text-sm font-semibold text-gray-700">Hours/Day</label>
                            <input type="number" id="hours" value="8" step="0.5" class="w-full mt-1 p-2 border border-gray-300 rounded">
                        </div>
                        <div>
                            <label class="block text-sm font-semibold text-gray-700">OEE Target (%)</label>
                            <input type="number" id="oee" value="80" min="1" max="100" class="w-full mt-1 p-2 border border-gray-300 rounded">
                        </div>
                    </div>

                    <button type="submit" class="w-full bg-blue-600 text-white font-bold p-3 rounded-lg hover:bg-blue-700 active:scale-95 transition shadow">
                        🚀 Upload to Google Sheets
                    </button>
                </form>
            </section>

            <!-- TAB 2: LIVE DATABASE VIEW -->
            <section id="dbTab" class="hidden space-y-4">
                <div class="bg-white p-4 rounded-xl shadow">
                    <h2 class="text-md font-bold text-gray-800 border-b pb-2 mb-3">Live Fleet Records</h2>
                    <div id="loadingState" class="text-center text-gray-500 py-6">Connecting to database...</div>
                    <div id="dbContainer" class="space-y-3 max-h-[70vh] overflow-y-auto pr-1"></div>
                </div>
            </section>
        </main>

        <!-- Bottom Navigation -->
        <nav class="fixed bottom-0 left-0 right-0 bg-white border-t border-gray-200 shadow-lg flex justify-around items-center h-16 z-50">
            <button id="navForm" class="flex flex-col items-center justify-center w-full h-full text-blue-600 font-bold border-r border-gray-100">
                <span class="text-xl">📝</span>
                <span class="text-xs">Add Machine</span>
            </button>
            <button id="navDb" class="flex flex-col items-center justify-center w-full h-full text-gray-500 font-semibold">
                <span class="text-xl">📊</span>
                <span class="text-xs">View Database</span>
            </button>
        </nav>
    </div>

    <!-- ========================================== -->
    <!-- JAVASCRIPT                                -->
    <!-- ========================================== -->
    <script>
        (function() {
            // ========================================
            // CONFIGURATION - YOUR APPS SCRIPT URL
            // ========================================
            // ⚠️ REPLACE THIS WITH YOUR APPS SCRIPT URL
            const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwUpQL6sUf-aqQ8NSuggRoigQ4PhBlWWkAhVXZcysti6JwQJcSWdtimcdTxrPDwvhff/exec";

            // ========================================
            // DOM REFS
            // ========================================
            const loginScreen = document.getElementById('loginScreen');
            const mainApp = document.getElementById('mainApp');
            const loginForm = document.getElementById('loginForm');
            const loginEmail = document.getElementById('loginEmail');
            const loginMessage = document.getElementById('loginMessage');
            const loginBtn = document.getElementById('loginBtn');
            const userBadge = document.getElementById('userBadge');
            const logoutBtn = document.getElementById('logoutBtn');
            const statusToast = document.getElementById('statusToast');
            const refreshBtn = document.getElementById('refreshBtn');

            // ========================================
            // CHECK SESSION
            // ========================================
            const savedEmail = sessionStorage.getItem('plantHubUser');
            if (savedEmail) {
                loginScreen.classList.add('hidden');
                mainApp.classList.remove('hidden');
                userBadge.textContent = savedEmail;
                initializeApp();
            }

            // ========================================
            // LOGIN HANDLER
            // ========================================
            loginForm.addEventListener('submit', async function(e) {
                e.preventDefault();
                const email = loginEmail.value.trim().toLowerCase();

                if (!email || !email.includes('@')) {
                    showLoginMessage('Please enter a valid email address.', 'red');
                    return;
                }

                showLoginMessage('Signing in...', 'blue');
                loginBtn.disabled = true;
                loginBtn.textContent = '⏳ Please wait...';

                try {
                    const response = await fetch(SCRIPT_URL, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ 
                            action: 'login',
                            email: email 
                        })
                    });

                    const text = await response.text();
                    let result;
                    try {
                        result = JSON.parse(text);
                    } catch(e) {
                        showLoginMessage('❌ Server error. Please try again.', 'red');
                        console.error('Non-JSON response:', text);
                        loginBtn.disabled = false;
                        loginBtn.textContent = '🚀 Sign In';
                        return;
                    }

                    if (result.success) {
                        sessionStorage.setItem('plantHubUser', email);
                        loginScreen.classList.add('hidden');
                        mainApp.classList.remove('hidden');
                        userBadge.textContent = email;
                        showLoginMessage('', '');
                        initializeApp();
                    } else {
                        showLoginMessage('❌ ' + (result.error || 'Login failed.'), 'red');
                    }
                } catch (err) {
                    showLoginMessage('❌ Network error. Check your connection.', 'red');
                    console.error('Login error:', err);
                }

                loginBtn.disabled = false;
                loginBtn.textContent = '🚀 Sign In';
            });

            function showLoginMessage(msg, color) {
                if (!msg) {
                    loginMessage.classList.add('hidden');
                    return;
                }
                loginMessage.classList.remove('hidden');
                loginMessage.className = 'mt-4 text-center text-sm font-semibold p-2 rounded ' +
                    (color === 'red' ? 'bg-red-100 text-red-700' :
                    color === 'blue' ? 'bg-blue-100 text-blue-700' :
                    'bg-gray-100 text-gray-700');
                loginMessage.textContent = msg;
            }

            // ========================================
            // LOGOUT
            // ========================================
            logoutBtn.addEventListener('click', function() {
                sessionStorage.removeItem('plantHubUser');
                loginScreen.classList.remove('hidden');
                mainApp.classList.add('hidden');
                loginEmail.value = '';
                loginMessage.classList.add('hidden');
            });

            // ========================================
            // TOAST HELPER
            // ========================================
            function showToast(msg, type) {
                statusToast.classList.remove('hidden', 'bg-green-100', 'text-green-800', 
                    'bg-red-100', 'text-red-800', 'bg-yellow-100', 'text-yellow-800');
                statusToast.className = 'mb-4 p-3 rounded text-center text-sm font-semibold block';
                
                if (type === 'success') {
                    statusToast.classList.add('bg-green-100', 'text-green-800');
                } else if (type === 'error') {
                    statusToast.classList.add('bg-red-100', 'text-red-800');
                } else {
                    statusToast.classList.add('bg-yellow-100', 'text-yellow-800');
                }
                statusToast.textContent = msg;
                
                setTimeout(() => statusToast.classList.add('hidden'), 3000);
            }

            // ========================================
            // INITIALIZE APP
            // ========================================
            function initializeApp() {
                // Machine types
                const machineTypes = [
                    "Tank", "Pump", "Turntable", "Bottle dryer",
                    "Automatic filling machine and capping machine",
                    "Manual filling machine", "Manual capping machine",
                    "Automatical Labelling machine", "Shrink wrapping machine",
                    "Automatic Label coding machine", "Automatic Inner carton coding machine",
                    "Tube filling machine", "Powder filling machine", "Tube sealing machine",
                    "Semi Automatic filling machine", "Tablet counting machine",
                    "ORS powder filling machine", "Blistering machine", "Compression Machine",
                    "Vibro sifter", "Powder blender", "Particle size reduction machine",
                    "Rapid mixer granulator", "Fluid bed dryer", "Oven", "Roller compactor machine"
                ];

                const typeSelect = document.getElementById('machineType');
                machineTypes.forEach(type => {
                    const opt = document.createElement('option');
                    opt.value = type;
                    opt.textContent = type;
                    typeSelect.appendChild(opt);
                });

                // Navigation
                const formTab = document.getElementById('formTab');
                const dbTab = document.getElementById('dbTab');
                const navForm = document.getElementById('navForm');
                const navDb = document.getElementById('navDb');
                const dbContainer = document.getElementById('dbContainer');
                const loadingState = document.getElementById('loadingState');

                navForm.addEventListener('click', () => {
                    formTab.classList.remove('hidden');
                    dbTab.classList.add('hidden');
                    refreshBtn.classList.add('hidden');
                    navForm.className = "flex flex-col items-center justify-center w-full h-full text-blue-600 font-bold border-r border-gray-100";
                    navDb.className = "flex flex-col items-center justify-center w-full h-full text-gray-500 font-semibold";
                });

                navDb.addEventListener('click', () => {
                    formTab.classList.add('hidden');
                    dbTab.classList.remove('hidden');
                    refreshBtn.classList.remove('hidden');
                    navForm.className = "flex flex-col items-center justify-center w-full h-full text-gray-500 font-semibold border-r border-gray-100";
                    navDb.className = "flex flex-col items-center justify-center w-full h-full text-blue-600 font-bold";
                    fetchDatabase();
                });

                refreshBtn.addEventListener('click', fetchDatabase);

                // ========================================
                // FETCH DATABASE
                // ========================================
                async function fetchDatabase() {
                    dbContainer.innerHTML = '';
                    loadingState.classList.remove('hidden');
                    loadingState.textContent = 'Syncing with live sheets...';

                    try {
                        const response = await fetch(SCRIPT_URL);
                        const result = await response.json();

                        loadingState.classList.add('hidden');

                        if (!result.success) {
                            dbContainer.innerHTML =
                                `<div class="text-center text-red-500 py-6 text-sm">❌ ${result.error || 'Failed to load data'}</div>`;
                            return;
                        }

                        const data = result.data || [];
                        if (data.length === 0) {
                            dbContainer.innerHTML =
                                `<div class="text-center text-gray-400 py-6 text-sm">No machines listed in spreadsheet yet.</div>`;
                            return;
                        }

                        [...data].reverse().forEach(item => {
                            const card = document.createElement('div');
                            card.className = "border border-gray-200 rounded-lg p-3 space-y-1 bg-gray-50 shadow-sm text-sm";
                            card.innerHTML = `
                                <div class="flex justify-between items-start border-b border-gray-200 pb-1 mb-1">
                                    <div>
                                        <h4 class="font-bold text-gray-900">${item["Machine Name"] || 'Unnamed Asset'}</h4>
                                        <p class="text-xs text-gray-500">ID: ${item["ID"] || 'N/A'} · ${item["Section"] || 'Other'}</p>
                                    </div>
                                    <span class="text-xs bg-blue-100 text-blue-800 px-2 py-0.5 rounded-full">${item["Machine Type"] || '—'}</span>
                                </div>
                                <div class="grid grid-cols-2 gap-1 text-xs text-gray-700">
                                    <span>⚡ Speed: ${item["Speed"] ?? '—'} ${item["Unit"] || ''}</span>
                                    <span>📊 OEE: ${item["OEE"] || '—'}</span>
                                    <span class="col-span-2">🏭 Output: ${typeof item["Actual Daily Output"] === 'number' ? item["Actual Daily Output"].toLocaleString() : item["Actual Daily Output"] || '—'} / day</span>
                                </div>
                            `;
                            dbContainer.appendChild(card);
                        });

                    } catch (err) {
                        loadingState.textContent = '❌ Failed to connect to database.';
                        console.error('Fetch error:', err);
                    }
                }

                // ========================================
                // SUBMIT FORM
                // ========================================
                document.getElementById('inventoryForm').addEventListener('submit', async function(e) {
                    e.preventDefault();

                    const machineName = document.getElementById('machineName').value.trim();
                    const machineId = document.getElementById('machineId').value.trim();
                    const section = document.getElementById('section').value;
                    const machineType = document.getElementById('machineType').value;
                    const speedValue = parseFloat(document.getElementById('speed').value);
                    const unit = document.getElementById('unit').value;
                    const hoursValue = parseFloat(document.getElementById('hours').value);
                    const oeePercent = parseFloat(document.getElementById('oee').value);

                    if (!machineName || !machineId || isNaN(speedValue) || isNaN(hoursValue) || isNaN(oeePercent)) {
                        showToast('⚠️ Please fill all fields correctly.', 'error');
                        return;
                    }

                    const actualDailyOutput = Math.round((hoursValue * 60) * speedValue * (oeePercent / 100));

                    const payload = [{
                        "Machine Name": machineName,
                        "ID": machineId,
                        "Section": section,
                        "Machine Type": machineType,
                        "Speed": speedValue,
                        "Unit": unit,
                        "Hours": hoursValue,
                        "OEE": oeePercent + "%",
                        "Actual Daily Output": actualDailyOutput,
                        "Timestamp": new Date().toLocaleString()
                    }];

                    showToast('Syncing with Google Sheets...', 'info');

                    try {
                        const response = await fetch(SCRIPT_URL, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify(payload)
                        });

                        const result = await response.json();

                        if (result.success) {
                            showToast('✓ Record appended to Google Sheet!', 'success');
                            document.getElementById('inventoryForm').reset();
                            document.getElementById('hours').value = '8';
                            document.getElementById('oee').value = '80';
                        } else {
                            throw new Error(result.error || 'Upload failed');
                        }
                    } catch (err) {
                        showToast('⚠️ ' + (err.message || 'Network timeout. Cloud sync failed.'), 'error');
                        console.error('Submit error:', err);
                    }
                });
            }
        })();
    </script>
</body>
</html>
